trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.15.6'

stages:

# ============================================================
# STAGE 1 - TERRAFORM PLAN
# ============================================================

- stage: TerraformPlan
  displayName: 'Terraform Plan'

  jobs:
  - job: Plan
    displayName: 'Terraform Format Validate Plan'

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Installing Terraform $(terraformVersion)..."

        mkdir -p "$HOME/bin"

        curl -fsSL \
          "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" \
          -o terraform.zip

        echo "Downloaded Terraform archive:"
        ls -lh terraform.zip

        echo "Extracting Terraform..."

        unzip -o terraform.zip -d "$HOME/bin"

        chmod +x "$HOME/bin/terraform"

        echo "##vso[task.prependpath]$HOME/bin"

        echo "Terraform installed at:"
        which terraform

        echo "Terraform version:"
        terraform version

      displayName: 'Install Terraform'

    # --------------------------------------------------------
    # Terraform Format
    # --------------------------------------------------------

    - bash: |
        cd terraform
        terraform fmt -check -recursive

      displayName: 'Terraform Format Check'

    # --------------------------------------------------------
    # Terraform Init / Validate / Plan
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Init Validate Plan'

      inputs:
        azureSubscription: 'azure-terraform'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true

        inlineScript: |
          set -e

          export ARM_USE_OIDC=true
          export ARM_USE_AZUREAD=true
          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_OIDC_TOKEN="$idToken"
          export ARM_TENANT_ID="$tenantId"
          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

          cd terraform

          echo "======================================"
          echo "Terraform Init"
          echo "======================================"

          terraform init

          echo "======================================"
          echo "Terraform Validate"
          echo "======================================"

          terraform validate

          echo "======================================"
          echo "Terraform Plan"
          echo "======================================"

          terraform plan \
            -var-file="environments/dev.tfvars" \
            -out=tfplan

    # --------------------------------------------------------
    # Publish Terraform Plan
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'

      inputs:
        targetPath: 'terraform/tfplan'
        artifact: 'terraform-plan'


# ============================================================
# STAGE 2 - TERRAFORM APPLY
# ============================================================

- stage: TerraformApply
  displayName: 'Terraform Apply'

  dependsOn: TerraformPlan

  condition: succeeded()

  jobs:

  - deployment: Apply
    displayName: 'Terraform Apply'

    environment: 'terraform-dev'

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self

          # --------------------------------------------------
          # Download Terraform Plan
          # --------------------------------------------------

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'

            inputs:
              artifactName: 'terraform-plan'
              targetPath: '$(Pipeline.Workspace)/terraform-plan'

          # --------------------------------------------------
          # Install Terraform
          # --------------------------------------------------

          - bash: |
              set -e

              echo "Installing Terraform $(terraformVersion)..."

              mkdir -p "$HOME/bin"

              curl -fsSL \
                "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" \
                -o terraform.zip

              echo "Extracting Terraform..."

              unzip -o terraform.zip -d "$HOME/bin"

              chmod +x "$HOME/bin/terraform"

              echo "##vso[task.prependpath]$HOME/bin"

              echo "Terraform version:"
              terraform version

            displayName: 'Install Terraform'

          # --------------------------------------------------
          # Terraform Apply
          # --------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Terraform Apply'

            inputs:
              azureSubscription: 'azure-terraform'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true

              inlineScript: |

                set -e

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                cd terraform

                echo "======================================"
                echo "Terraform Init"
                echo "======================================"

                terraform init

                echo "======================================"
                echo "Terraform Apply"
                echo "======================================"

                terraform apply \
                  "$(Pipeline.Workspace)/terraform-plan/tfplan"